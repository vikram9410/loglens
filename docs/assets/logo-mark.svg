<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="LogLens">
  <title>LogLens</title>
  <defs>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- Lens ring -->
  <circle cx="52" cy="52" r="40" fill="none" stroke="url(#mark-grad)" stroke-width="10"/>
  <!-- Log lines inside lens (drawn as rects for renderer compatibility) -->
  <rect x="32" y="35"   width="40" height="5"  rx="2.5" fill="url(#mark-grad)"/>
  <rect x="32" y="49.5" width="34" height="5"  rx="2.5" fill="url(#mark-grad)" opacity="0.65"/>
  <rect x="32" y="63.5" width="38" height="5"  rx="2.5" fill="url(#mark-grad)" opacity="0.85"/>
  <!-- Handle -->
  <line x1="82" y1="82" x2="108" y2="108" stroke="url(#mark-grad)" stroke-width="12" stroke-linecap="round"/>
  <!-- AI spark dot at top-right -->
  <circle cx="86" cy="22" r="6" fill="url(#mark-grad)"/>
</svg>
